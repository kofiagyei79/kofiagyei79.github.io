# ====================================================================
# Kofi Okrah Agyei - Enterprise Security Cyber Range Telemetry Schema
# Location: /opt/splunkforwarder/etc/apps/search/local/inputs.conf
# ====================================================================

# 1. Harvest Linux authentication records for brute-force tracking
[monitor:///var/log/secure]
disabled = false
sourcetype = linux_secure
index = network_logs

# 2. Harvest Apache web daemon access event streams for command injection auditing
[monitor:///var/log/httpd/access_log]
disabled = false
sourcetype = access_combined
index = web_logs

# 3. Harvest host interactive command line logs to trace malicious lateral movement
[monitor:///root/.bash_history]
disabled = false
sourcetype = bash_history
index = network_logs

# Splunk Universal Forwarder - Endpoint Log Ingestion Rules
# Path: ./defensive-blue-team/splunk/inputs.conf

[default]
host = target-lan-node

# 1. Linux Authentication Records (For SSH Brute Force Detection)
[monitor:///var/log/auth.log]
disabled = false
index = network_logs
sourcetype = linux_secure
current_day_only = false

# 2. Corporate Web Server Access Logs (For SAMAMTV Web Exploitation Detection)
[monitor:///var/log/apache2/access.log]
disabled = false
index = web_logs
sourcetype = access_combined
_rcvbuf = 1572864

# 3. Host Shell Histories (Auditing Post-Exploitation Commands)
[monitor:///home/*/.bash_history]
disabled = false
index = network_logs
sourcetype = bash_history

[monitor:///root/.bash_history]
disabled = false
index = network_logs
sourcetype = bash_history
