# ====================================================================
# Kofi Okrah Agyei - Enterprise Security Cyber Range Alert Automation
# Location: /opt/splunk/etc/apps/search/local/savedsearches.conf
# ====================================================================

[Alert_1_Nmap_Port_Scan_Detection]
search = index=firewall_logs sourcetype=pfsense src_ip="10.1.1.10" dest_ip="192.168.60.50" action="blocked" OR action="rejected" | bucket _time span=1m | stats dc(dest_port) as unique_ports_scanned by _time, src_ip, dest_ip | where unique_ports_scanned > 20
cron_schedule = * * * * *
dispatch.earliest_time = -2m
dispatch.latest_time = now
enableSched = 1
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = src_ip,dest_ip
alert.suppress.period = 5m
description = Triggers when a remote attacker probes >20 unique ports inside a 1-minute window across the pfSense VPN.

[Alert_2_SSH_Brute_Force_Detection]
search = index=network_logs sourcetype=linux_secure src_ip="10.1.1.10" dest_ip="192.168.60.131" "Failed password" | stats count by src_ip, dest_ip, user | where count > 5
cron_schedule = * * * * *
dispatch.earliest_time = -2m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = src_ip,user
alert.suppress.period = 10m
description = Alerts on automated credential stuffing or dictionary attacks targeting host user profiles.

[Alert_3_Web_Exploitation_Detection]
search = index=web_logs sourcetype=access_combined dest_ip="192.168.60.50" (status=404 OR status=403) AND (uri_path="*etc/passwd*" OR uri_path="*cmd.exe*" OR uri_path="*bin/sh*") | table _time, src_ip, uri_path, status
cron_schedule = */2 * * * *
dispatch.earliest_time = -3m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
description = Monitors corporate web daemon response traffic for active directory traversal and shell command injections.
